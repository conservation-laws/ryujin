name: indentation

on: [push, pull_request]

concurrency:
  group: ${ {github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

permissions:
  contents: read

jobs:

  ################
  # clang-format #
  ################

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'true'
    - name: setup
      # Use the same clang-format binary that deal.II provides via its
      # contrib/utilities/download_clang_format script.
      env:
        VERSION: 23
        URL: https://github.com/dealii/dealii/releases/download/v9.8.0
        CHECKSUM: ad08d6d0e4a28f28459da4dc26bbdc4b99610597929a800b955caa29b0d65f4a
      run: |
        set -euo pipefail
        FILENAME="clang-format-${VERSION}-linux.tar.gz"
        cd "${RUNNER_TEMP}"
        curl -sSfLO "${URL}/${FILENAME}"
        echo "${CHECKSUM}  ${FILENAME}" | sha256sum -c
        tar xfz "${FILENAME}"
        echo "${RUNNER_TEMP}/clang-${VERSION}/bin" >> "${GITHUB_PATH}"
    - name: clang-format
      run: |
        clang-format --version
        git ls-files 'include/*.h' 'source/*.h' 'source/*.cc' 'tests/*.h' 'tests/*.cc' \
          | xargs -P "$(nproc)" -n 20 clang-format --dry-run --Werror
