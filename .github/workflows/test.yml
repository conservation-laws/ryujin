name: verification

on:
  push:
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review

concurrency:
  group: ${ {github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

permissions:
  contents: read

jobs:

  #############################################
  # ubuntu-lts-26.04 with gcc, deal.II master #
  #############################################

  ubuntu-lts-2604-dealii-master-release:
    name: tests-release-deal.II-master
    runs-on: [ubuntu-latest]

    container:
      options: --user root
      image: dealii/dealii:master-resolute

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'true'
    - name: info
      run: |
        g++ -v
        cmake --version
    - name: configure release
      run: |
        mkdir build-release
        cd build-release
        cmake -DWITH_OPENMP=on ..
    - name: build release
      run: |
        cd build-release
        make VERBOSE=1 -j2
    - name: test release
      run: |
        export OMPI_ALLOW_RUN_AS_ROOT=1
        export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
        cd build-release
        # skip a number of expensive verification tests:
        ctest --output-on-failure -j2 -VV -E \
          "(verification-isentropic_vortex.*l7|verification-becker_solution.*l7)"

  #############################################
  # ubuntu-lts-26.04 with gcc, deal.II master #
  #############################################

  ubuntu-lts-2604-dealii-master-debug:
    name: tests-debug-deal.II-master
    runs-on: [ubuntu-latest]

    container:
      options: --user root
      image: dealii/dealii:master-resolute

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'true'
    - name: info
      run: |
        g++ -v
        cmake --version
    - name: configure debug
      run: |
        mkdir build-debug
        cd build-debug
        cmake -DWITH_OPENMP=on -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG="-O2" ..
    - name: build debug
      run: |
        cd build-debug
        make VERBOSE=1 -j2
    - name: test debug
      run: |
        export OMPI_ALLOW_RUN_AS_ROOT=1
        export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
        cd build-debug
        # skip a number of expensive verification tests:
        ctest --output-on-failure -j2 -VV -E \
          "(verification-isentropic_vortex.*l7|verification-becker_solution.*l7)"
