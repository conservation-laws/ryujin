name: build

on:
  push:
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review

concurrency:
  group: ${ {github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

permissions:
  contents: read

jobs:

  #############################################
  # ubuntu-lts-26.04 with gcc, deal.II master #
  #############################################

  ubuntu-lts-2604-dealii-master:
    name: lts-2604-deal.II-master
    runs-on: [ubuntu-latest]

    container:
      options: --user root
      image: dealii/dealii:master-resolute

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'true'
    - name: info
      run: |
        g++ -v
        cmake --version
    - name: configure release
      run: |
        mkdir build-release
        cd build-release
        cmake -DCMAKE_CXX_FLAGS="-Werror" -DWITH_OPENMP=on ..
    - name: build release
      run: |
        cd build-release
        make VERBOSE=1 -j2
    - name: configure debug
      run: |
        mkdir build-debug
        cd build-debug
        cmake -DCMAKE_CXX_FLAGS="-Werror" -DWITH_OPENMP=on -DCMAKE_BUILD_TYPE=Debug ..
    - name: build debug
      run: |
        cd build-debug
        make VERBOSE=1 -j2

  #############################################
  # ubuntu-lts-26.04 with gcc, deal.II master #
  #############################################

  ubuntu-lts-2604-dealii-master-float:
    name: lts-2604-deal.II-master-float
    runs-on: [ubuntu-latest]

    container:
      options: --user root
      image: dealii/dealii:master-resolute

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'true'
    - name: info
      run: |
        g++ -v
        cmake --version
    - name: configure release
      run: |
        mkdir build-release
        cd build-release
        cmake -DNUMBER="float" -DCMAKE_CXX_FLAGS="-Werror" -DWITH_OPENMP=on ..
    - name: build release
      run: |
        cd build-release
        make VERBOSE=1 -j2
    - name: configure debug
      run: |
        mkdir build-debug
        cd build-debug
        cmake -DNUMBER="float" -DCMAKE_CXX_FLAGS="-Werror" -DWITH_OPENMP=on -DCMAKE_BUILD_TYPE=Debug ..
    - name: build debug
      run: |
        cd build-debug
        make VERBOSE=1 -j2

  ###############################################
  # ubuntu-lts-26.04 with clang, deal.II master #
  ###############################################

  ubuntu-lts-2604-dealii-clang:
    name: lts-2604-deal.II-master-clang
    runs-on: [ubuntu-latest]

    container:
      options: --user root
      image: dealii/dealii:master-resolute

    steps:
    - name: install clang
      run: |
        sudo apt update
        sudo apt install -y clang libomp-dev
    - uses: actions/checkout@v3
      with:
        submodules: 'true'
    - name: info
      run: |
        g++ -v
        cmake --version
    - name: configure release
      run: |
        mkdir build-release
        cd build-release
        cmake \
          -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS="-Werror -Wno-unknown-warning-option -Wno-ignored-optimization-argument -Wno-pass-failed" \
          -DFORCE_DEAL_II_SPARSE_MATRIX=yes \
          -DBUG_COLLECT_PERIODIC_FACES_INSTANTIATION=yes \
          -DWITH_OPENMP=on ..
    - name: build release
      run: |
        cd build-release
        make VERBOSE=1 -j2
    - name: configure debug
      run: |
        mkdir build-debug
        cd build-debug
        cmake \
          -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS="-Werror -Wno-unknown-warning-option -Wno-ignored-optimization-argument" \
          -DFORCE_DEAL_II_SPARSE_MATRIX=yes \
          -DBUG_COLLECT_PERIODIC_FACES_INSTANTIATION=yes \
          -DWITH_OPENMP=on -DCMAKE_BUILD_TYPE=Debug ..
    - name: build debug
      run: |
        cd build-debug
        make VERBOSE=1 -j2

  ########################################
  # ubuntu-lts-26.04 with gcc, no openmp #
  ########################################

  ubuntu-lts-2604-dealii-no_openmp:
    name: lts-2604-deal.II-master-noopenmp
    runs-on: [ubuntu-latest]

    container:
      options: --user root
      image: dealii/dealii:master-resolute

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'true'
    - name: info
      run: |
        g++ -v
        cmake --version
    - name: configure no_openmp
      run: |
        mkdir build-no_openmp
        cd build-no_openmp
        cmake -DCMAKE_CXX_FLAGS="-Werror" -DWITH_OPENMP=off ..
    - name: build no_openmp
      run: |
        cd build-no_openmp
        make VERBOSE=1 -j2

  ###############################################
  # ubuntu-lts-24.04 with gcc-13, deal.II 9.7.1 #
  ###############################################

  ubuntu-lts-2404-dealii-971:
    name: lts-2404-deal.II-9.7.1
