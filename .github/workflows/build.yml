        cmake -DCMAKE_CXX_FLAGS="-Werror" -DWITH_OPENMP=on ..
    - name: build release
      run: |
        cd build-release
        make VERBOSE=1 -j2
    - name: configure debug
      run: |
        mkdir build-debug
        cd build-debug
        cmake -DCMAKE_CXX_FLAGS="-Werror" -DWITH_OPENMP=on -DCMAKE_BUILD_TYPE=Debug ..



  ###############################################
  # ubuntu-lts-24.04 with gcc-13, deal.II 9.6.2 #
  ###############################################

  ubuntu-lts-2404-dealii-962:
    name: lts-2404-deal.II-9.6.2
    runs-on: [ubuntu-24.04]

    container:
      options: --user root
      image: dealii/dealii:v9.6.2-noble

    steps:
    - uses: actions/checkout@v3
      with:
